services:
  backend:
    build: ./backend
    environment:
      FOLIO_DATA_DIR: /data
      FOLIO_JOB_WORKERS: "4"
    volumes:
      - folio-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  folio-data:
