<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>Folio PDF</title>
    <style>
      :root {
        --ink: #080a14;
        --brand: #3443f5;
        --violet: #7c3aed;
        --text: #e8eaf6;
        --muted: #8a90b4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: var(--text);
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(520px 260px at 50% -10%, rgb(52 67 245 / 0.28), transparent 70%),
          radial-gradient(420px 220px at 100% 110%, rgb(124 58 237 / 0.22), transparent 70%),
          var(--ink);
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .mark {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(135deg, #4a63ff 0%, var(--brand) 45%, var(--violet) 100%);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.3), 0 14px 40px -10px rgb(52 67 245 / 0.7);
        animation: float 2.4s ease-in-out infinite;
      }
      .mark::after {
        content: '';
        position: absolute;
        top: -50%;
        left: 0;
        width: 100%;
        height: 100%;
        transform: rotate(12deg);
        background: rgb(255 255 255 / 0.1);
      }
      .mark svg { width: 42px; height: 42px; position: relative; z-index: 1; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      h1 span { color: var(--muted); font-weight: 600; }
      p { margin: 0; font-size: 12.5px; color: var(--muted); }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
        position: relative;
      }
      .bar::before {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--brand), var(--violet));
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) {
        .mark, .bar::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l5 5v13H7z" />
          <path d="M14 3v5h5" />
          <path d="M10 13h6M10 17h4" />
        </svg>
      </div>
      <h1>Folio <span>PDF</span></h1>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p>Starting the PDF engine…</p>
    </div>
  </body>
</html>
