name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System deps (tesseract, ghostscript, libreoffice, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr ghostscript qpdf libreoffice-writer libreoffice-calc libreoffice-impress libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
